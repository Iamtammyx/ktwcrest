document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r-spacing:.2em;text-transform:uppercase;color:#C8A45D\">Delivery model<\u002Fp>\n      <h2 style=\"margin:0;font:300 clamp(30px,3.6vw,48px)/1.12 Spectral,Georgia,serif;color:#FFFFFF\">Five steps, run with consulting discipline<\u002Fh2>\n    <\u002Fdiv>\n    <p style=\"margin:0;max-width:34ch;font:400 14.5px/1.6 Manrope,sans-serif;color:#93A3BD\">Each step has named outputs, so you always know what you are approving.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:14px\">\n    <sc-for list=\"{{ steps }}\" as=\"st\" hint-placeholder-count=\"5\">\n      <div data-reveal=\"\" style=\"padding:24px 20px;border-radius:18px;background:radial-gradient(140% 140% at 50% 0%, rgba(36,52,84,.55), rgba(8,15,28,.8));backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.10);box-shadow:0 18px 40px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.1)\">\n        <p style=\"margin:0 0 14px;font:300 34px/1 Spectral,Georgia,serif;color:rgba(200,164,93,.85)\">{{ st.no }}<\u002Fp>\n        <h3 style=\"margin:0 0 8px;font:600 17px/1.25 Manrope,sans-serif;color:#FFFFFF\">{{ st.title }}<\u002Fh3>\n        <p style=\"margin:0;font:400 13.5px/1.55 Manrope,sans-serif;color:#A6B5CC\">{{ st.body }}<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"Featured solutions\" style=\"background:rgba(6,12,22,.9);border-top:1px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,120px) clamp(18px,4vw,40px)\">\n    <div data-reveal=\"\" style=\"max-width:680px;margin-bottom:clamp(32px,4vw,48px)\">\n      <p style=\"margin:0 0 14px;font:500 11.5px/1 Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#C8A45D\">Featured solutions<\u002Fp>\n      <h2 style=\"margin:0 0 16px;font:300 clamp(30px,3.6vw,48px)/1.12 Spectral,Georgia,serif;color:#FFFFFF\">What we build, in practice<\u002Fh2>\n      <p style=\"margin:0;font:400 16px/1.62 Manrope,sans-serif;color:#B6C4D9\">Interface imagery below is reserved for KTW Crest product screenshots. Supply exports and we will drop them in.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:18px\">\n      <sc-for list=\"{{ solutions }}\" as=\"sol\" hint-placeholder-count=\"4\">\n        <div data-reveal=\"\" style=\"border-radius:20px;overflow:hidden;background:radial-gradient(130% 130% at 0% 0%, rgba(34,50,80,.6), rgba(8,15,28,.86));backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.11);box-shadow:0 22px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.11)\">\n          <div style=\"aspect-ratio:16/9;display:flex;align-items:flex-end;padding:16px;background:repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 9px, rgba(255,255,255,0) 9px 18px), linear-gradient(160deg, rgba(49,92,245,.18), rgba(6,12,22,.6));border-bottom:1px solid rgba(255,255,255,.09)\">\n            <span style=\"font:500 10.5px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">{{ sol.slot }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:22px 24px 24px\">\n            <h3 style=\"margin:0 0 8px;font:600 18px/1.3 Manrope,sans-serif;color:#FFFFFF\">{{ sol.title }}<\u002Fh3>\n            <p style=\"margin:0;font:400 14px/1.6 Manrope,sans-serif;color:#A6B5CC\">{{ sol.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"about\" data-screen-label=\"Expertise\" style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,120px) clamp(18px,4vw,40px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:clamp(28px,5vw,64px);align-items:start\">\n    <div data-reveal=\"\">\n      <p style=\"margin:0 0 14px;font:500 11.5px/1 Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#C8A45D\">Expertise<\u002Fp>\n      <h2 style=\"margin:0 0 20px;font:300 clamp(30px,3.6vw,48px)/1.12 Spectral,Georgia,serif;color:#FFFFFF\">A team assembled around the whole problem<\u002Fh2>\n      <p style=\"margin:0 0 18px;font:400 16px/1.65 Manrope,sans-serif;color:#B6C4D9\">KTW Crest was registered in 2016 and works as one multidisciplinary team: strategy, engineering, data, design and delivery management in the same room as your business owners.<\u002Fp>\n      <p style=\"margin:0 0 28px;font:400 16px/1.65 Manrope,sans-serif;color:#B6C4D9\">Our practitioners bring senior consulting experience from large-scale transformation programmes. We represent only our own work — never a former employer.<\u002Fp>\n      <div style=\"aspect-ratio:4/3;border-radius:20px;display:flex;align-items:flex-end;padding:18px;background:repeating-linear-gradient(135deg, rgba(255,255,255,.05) 0 9px, rgba(255,255,255,0) 9px 18px), rgba(8,15,28,.55);border:1px dashed rgba(255,255,255,.18)\">\n        <span style=\"font:500 10.5px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">Image — team at work, real photography<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"display:grid;gap:12px\">\n      <sc-for list=\"{{ disciplines }}\" as=\"d\" hint-placeholder-count=\"5\">\n        <div style=\"padding:22px 24px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09);transition:background .3s, border-color .3s\" style-hover=\"background:rgba(255,255,255,.07);border-color:rgba(200,164,93,.35)\">\n          <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:6px\">\n            <span style=\"font:300 12px/1 Spectral,Georgia,serif;letter-spacing:.14em;color:#C8A45D\">{{ d.no }}<\u002Fspan>\n            <h3 style=\"margin:0;font:600 17px/1.3 Manrope,sans-serif;color:#FFFFFF\">{{ d.title }}<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"margin:0;font:400 14px/1.6 Manrope,sans-serif;color:#A6B5CC\">{{ d.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"work\" data-screen-label=\"Case studies\" style=\"background:rgba(6,12,22,.9);border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,120px) clamp(18px,4vw,40px)\">\n    <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:clamp(28px,4vw,44px)\">\n      <div style=\"max-width:620px\">\n        <p style=\"margin:0 0 14px;font:500 11.5px/1 Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#C8A45D\">Selected work<\u002Fp>\n        <h2 style=\"margin:0;font:300 clamp(30px,3.6vw,48px)/1.12 Spectral,Georgia,serif;color:#FFFFFF\">Case studies<\u002Fh2>\n      <\u002Fdiv>\n      <span style=\"padding:8px 14px;border-radius:999px;border:1px dashed rgba(200,164,93,.5);background:rgba(200,164,93,.08);font:600 11px/1.3 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#E2CB9A\">Placeholder — awaiting approved client content<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:18px\">\n      <sc-for list=\"{{ cases }}\" as=\"c\" hint-placeholder-count=\"3\">\n        <div data-reveal=\"\" style=\"border-radius:20px;overflow:hidden;border:1px dashed rgba(255,255,255,.16);background:rgba(255,255,255,.03)\">\n          <div style=\"aspect-ratio:3/2;display:flex;align-items:flex-end;padding:16px;background:repeating-linear-gradient(135deg, rgba(255,255,255,.045) 0 9px, rgba(255,255,255,0) 9px 18px)\">\n            <span style=\"font:500 10.5px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">{{ c.slot }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:22px 24px 24px;border-top:1px dashed rgba(255,255,255,.14)\">\n            <p style=\"margin:0 0 10px;font:500 11px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8391A8\">{{ c.kind }}<\u002Fp>\n            <h3 style=\"margin:0 0 8px;font:600 17px/1.3 Manrope,sans-serif;color:#EAF0FA\">{{ c.title }}<\u002Fh3>\n            <p style=\"margin:0;font:400 13.5px/1.6 Manrope,sans-serif;color:#93A3BD\">{{ c.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"insights\" data-screen-label=\"Capability contexts\" style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,120px) clamp(18px,4vw,40px)\">\n  <div data-reveal=\"\" style=\"max-width:700px;margin-bottom:clamp(28px,4vw,40px)\">\n    <p style=\"margin:0 0 14px;font:500 11.5px/1 Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#C8A45D\">Where the work applies<\u002Fp>\n    <h2 style=\"margin:0 0 16px;font:300 clamp(30px,3.6vw,48px)/1.12 Spectral,Georgia,serif;color:#FFFFFF\">Adaptable expertise, not narrow specialisation<\u002Fh2>\n    <p style=\"margin:0;font:400 16px/1.62 Manrope,sans-serif;color:#B6C4D9\">Our methods transfer across contexts. We will tell you plainly where we have direct experience and where we would ramp up.<\u002Fp>\n  <\u002Fdiv>\n  <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:10px\">\n    <sc-for list=\"{{ contexts }}\" as=\"cx\" hint-placeholder-count=\"9\">\n      <span style=\"padding:12px 18px;border-radius:999px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);font:500 13.5px/1.2 Manrope,sans-serif;color:#C7D4E8;transition:background .3s,border-color .3s\" style-hover=\"background:rgba(120,167,255,.14);border-color:rgba(120,167,255,.35)\">{{ cx }}<\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-screen-label=\"KTW Guide panel\" style=\"background:rgba(6,12,22,.9);border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,120px) clamp(18px,4vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:clamp(28px,5vw,60px);align-items:center\">\n    <div data-reveal=\"\">\n      <p style=\"margin:0 0 14px;font:500 11.5px/1 Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#C8A45D\">AI assistant<\u002Fp>\n      <h2 style=\"margin:0 0 18px;font:300 clamp(30px,3.6vw,48px)/1.12 Spectral,Georgia,serif;color:#FFFFFF\">Meet KTW Guide<\u002Fh2>\n      <p style=\"margin:0 0 24px;font:400 16px/1.65 Manrope,sans-serif;color:#B6C4D9;max-width:56ch\">An AI assistant that explains our services, asks the right discovery questions and drafts a project brief you approve before anything is sent. It answers only from an approved KTW Crest knowledge base.<\u002Fp>\n      <ul style=\"margin:0 0 28px;padding:0;list-style:none;display:grid;gap:12px\">\n        <sc-for list=\"{{ guidePoints }}\" as=\"g\" hint-placeholder-count=\"4\">\n          <li style=\"display:flex;gap:12px;align-items:flex-start\"><span aria-hidden=\"true\" style=\"flex:0 0 auto;margin-top:7px;width:6px;height:6px;border-radius:999px;background:#C8A45D\"><\u002Fspan><span style=\"font:400 14.5px/1.6 Manrope,sans-serif;color:#C7D4E8\">{{ g }}<\u002Fspan><\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n      <button type=\"button\" sc-camel-on-click=\"{{ openChat }}\" style=\"display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:12px;background:#315CF5;color:#FFFFFF;font:600 15px/1 Manrope,sans-serif;border:1px solid rgba(255,255,255,.2);cursor:pointer;box-shadow:0 16px 40px rgba(49,92,245,.35);min-height:48px\" style-hover=\"background:#2649D4\">Open KTW Guide<\u002Fbutton>\n      <p style=\"margin:16px 0 0;font:400 12.5px/1.6 Manrope,sans-serif;color:#7D8DA6\">Demo mode: replies come from local approved content. Connect a secure server endpoint before production use.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"\" style=\"padding:20px;border-radius:22px;background:radial-gradient(130% 130% at 100% 0%, rgba(40,58,92,.7), rgba(8,15,28,.9));backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.15)\">\n      <div style=\"display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.1)\">\n        <span style=\"width:9px;height:9px;border-radius:999px;background:#78A7FF;box-shadow:0 0 12px rgba(120,167,255,.8)\"><\u002Fspan>\n        <span style=\"font:600 13.5px/1 Manrope,sans-serif;color:#F3F6FB\">KTW Guide<\u002Fspan>\n        <span style=\"font:500 10.5px/1 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8391A8\">AI assistant<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:12px;padding-top:16px\">\n        <div style=\"max-width:88%;padding:14px 16px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)\"><p style=\"margin:0;font:400 13.5px/1.55 Manrope,sans-serif;color:#DCE5F3\">Welcome to KTW Crest. I can help you explore our services, shape a project brief, or request a consultation. What would you like to achieve?<\u002Fp><\u002Fdiv>\n        <div style=\"align-self:flex-end;max-width:80%;padding:12px 16px;border-radius:14px 14px 4px 14px;background:rgba(49,92,245,.35);border:1px solid rgba(120,167,255,.35)\"><p style=\"margin:0;font:400 13.5px/1.55 Manrope,sans-serif;color:#EAF0FA\">We need one view of our customers across three systems.<\u002Fp><\u002Fdiv>\n        <div style=\"max-width:88%;padding:14px 16px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)\"><p style=\"margin:0;font:400 13.5px/1.55 Manrope,sans-serif;color:#DCE5F3\">That points to CRM strategy plus integration. May I ask four short questions to draft a brief for you to approve?<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"contact\" data-screen-label=\"Contact\" style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,8vw,120px) clamp(18px,4vw,40px)\">\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:clamp(28px,5vw,60px);align-items:start\">\n    <div data-reveal=\"\">\n      <p style=\"margin:0 0 14px;font:500 11.5px/1 Manrope,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#C8A45D\">Start a project<\u002Fp>\n      <h2 style=\"margin:0 0 18px;font:300 clamp(30px,3.6vw,48px)/1.12 Spectral,Georgia,serif;color:#FFFFFF\">Tell us what needs to work better<\u002Fh2>\n      <p style=\"margin:0 0 28px;font:400 16px/1.65 Manrope,sans-serif;color:#B6C4D9;max-width:52ch\">A senior consultant reads every enquiry. We will confirm scope, price and delivery dates together — never before we understand the problem.<\u002Fp>\n      <div style=\"display:grid;gap:14px;max-width:420px\">\n        <div style=\"padding:18px 20px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09)\">\n          <p style=\"margin:0 0 6px;font:500 11px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8391A8\">Email<\u002Fp>\n          <p style=\"margin:0;font:500 15px/1.4 ui-monospace,Menlo,monospace;color:#C7D4E8\">[ email address to confirm ]<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:18px 20px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09)\">\n          <p style=\"margin:0 0 6px;font:500 11px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8391A8\">Phone<\u002Fp>\n          <p style=\"margin:0;font:500 15px/1.4 ui-monospace,Menlo,monospace;color:#C7D4E8\">[ phone number to confirm ]<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <form data-reveal=\"\" sc-camel-on-submit=\"{{ submitForm }}\" novalidate=\"true\" style=\"padding:clamp(22px,3vw,32px);border-radius:22px;background:radial-gradient(130% 130% at 0% 0%, rgba(38,54,86,.62), rgba(8,15,28,.88));backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.13);box-shadow:0 30px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.14)\">\n      <sc-if value=\"{{ formSent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:20px 0\">\n          <span style=\"display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;background:rgba(120,167,255,.18);border:1px solid rgba(120,167,255,.4);font:600 18px/1 Manrope,sans-serif;color:#9CC0FF\">✓<\u002Fspan>\n          <h3 style=\"margin:0;font:600 20px/1.3 Manrope,sans-serif;color:#FFFFFF\">Enquiry received<\u002Fh3>\n          <p style=\"margin:0;font:400 14.5px/1.6 Manrope,sans-serif;color:#B6C4D9\">Demo mode — nothing was transmitted. In production this posts to your secure endpoint and a consultant replies within two working days.<\u002Fp>\n          <button type=\"button\" sc-camel-on-click=\"{{ resetForm }}\" style=\"padding:12px 20px;border-radius:10px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#EAF0FA;font:600 13.5px/1 Manrope,sans-serif;cursor:pointer;min-height:44px\">Send another<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ formOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid;gap:16px\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px\">\n            <label style=\"display:grid;gap:7px\"><span style=\"font:500 12px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">Name *<\u002Fspan><input type=\"text\" value=\"{{ form.name }}\" sc-camel-on-input=\"{{ onField }}\" data-field=\"name\" style=\"padding:13px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#F3F6FB;font:400 15px/1.3 Manrope,sans-serif;min-height:46px\"><\u002Flabel>\n            <label style=\"display:grid;gap:7px\"><span style=\"font:500 12px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">Organisation<\u002Fspan><input type=\"text\" value=\"{{ form.org }}\" sc-camel-on-input=\"{{ onField }}\" data-field=\"org\" style=\"padding:13px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#F3F6FB;font:400 15px/1.3 Manrope,sans-serif;min-height:46px\"><\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px\">\n            <label style=\"display:grid;gap:7px\"><span style=\"font:500 12px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">Work email *<\u002Fspan><input type=\"email\" value=\"{{ form.email }}\" sc-camel-on-input=\"{{ onField }}\" data-field=\"email\" style=\"padding:13px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#F3F6FB;font:400 15px/1.3 Manrope,sans-serif;min-height:46px\"><\u002Flabel>\n            <label style=\"display:grid;gap:7px\"><span style=\"font:500 12px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">Phone (optional)<\u002Fspan><input type=\"tel\" value=\"{{ form.phone }}\" sc-camel-on-input=\"{{ onField }}\" data-field=\"phone\" style=\"padding:13px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#F3F6FB;font:400 15px/1.3 Manrope,sans-serif;min-height:46px\"><\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:16px\">\n            <label style=\"display:grid;gap:7px\"><span style=\"font:500 12px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">Service interest<\u002Fspan><sc-raw-select value=\"{{ form.service }}\" sc-camel-on-change=\"{{ onField }}\" data-field=\"service\" style=\"padding:13px 14px;border-radius:11px;background:rgba(10,20,36,.9);border:1px solid rgba(255,255,255,.14);color:#F3F6FB;font:400 15px/1.3 Manrope,sans-serif;min-height:46px\">\n              <sc-for list=\"{{ serviceNames }}\" as=\"n\" hint-placeholder-count=\"8\"><option value=\"{{ n }}\">{{ n }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select><\u002Flabel>\n            <label style=\"display:grid;gap:7px\"><span style=\"font:500 12px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">Project stage<\u002Fspan><sc-raw-select value=\"{{ form.stage }}\" sc-camel-on-change=\"{{ onField }}\" data-field=\"stage\" style=\"padding:13px 14px;border-radius:11px;background:rgba(10,20,36,.9);border:1px solid rgba(255,255,255,.14);color:#F3F6FB;font:400 15px/1.3 Manrope,sans-serif;min-height:46px\">\n              <sc-for list=\"{{ stages }}\" as=\"sg\" hint-placeholder-count=\"4\"><option value=\"{{ sg }}\">{{ sg }}<\u002Foption><\u002Fsc-for>\n            <\u002Fsc-raw-select><\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display:grid;gap:7px\"><span style=\"font:500 12px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#93A3BD\">What are you trying to achieve? *<\u002Fspan><textarea rows=\"4\" value=\"{{ form.message }}\" sc-camel-on-input=\"{{ onField }}\" data-field=\"message\" style=\"padding:13px 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#F3F6FB;font:400 15px/1.5 Manrope,sans-serif;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n            <sc-for list=\"{{ contactPrefs }}\" as=\"cp\" hint-placeholder-count=\"3\">\n              <button type=\"button\" sc-camel-on-click=\"{{ setPref }}\" data-pref=\"{{ cp.id }}\" style=\"padding:10px 16px;border-radius:999px;cursor:pointer;font:500 13px/1.2 Manrope,sans-serif;min-height:44px;background:{{ cp.bg }};border:1px solid {{ cp.border }};color:{{ cp.color }}\">{{ cp.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <label style=\"display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1)\">\n            <input type=\"checkbox\" checked=\"{{ form.consent }}\" sc-camel-on-change=\"{{ onConsent }}\" style=\"margin-top:3px;width:18px;height:18px;accent-color:#315CF5\">\n            <span style=\"font:400 13px/1.55 Manrope,sans-serif;color:#B6C4D9\">I agree that KTW Crest may store and use these details to respond to my enquiry. <a href=\"#footer\">Privacy notice<\u002Fa>.<\u002Fspan>\n          <\u002Flabel>\n          <input type=\"text\" value=\"\" sc-camel-on-input=\"{{ onHoneypot }}\" tabindex=\"-1\" aria-hidden=\"true\" autocomplete=\"off\" style=\"position:absolute;left:-9999px;width:1px;height:1px;opacity:0\">\n          <sc-if value=\"{{ formError }}\" hint-placeholder-val=\"{{ false }}\">\n            <p role=\"alert\" style=\"margin:0;padding:12px 14px;border-radius:11px;background:rgba(255,90,90,.12);border:1px solid rgba(255,120,120,.35);font:500 13px/1.5 Manrope,sans-serif;color:#FFC7C7\">{{ formError }}<\u002Fp>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px\">\n            <button type=\"submit\" style=\"display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:12px;background:#315CF5;color:#FFFFFF;font:600 15px/1 Manrope,sans-serif;border:1px solid rgba(255,255,255,.2);cursor:pointer;box-shadow:0 16px 40px rgba(49,92,245,.35);min-height:48px\" style-hover=\"background:#2649D4\">{{ submitLabel }}<\u002Fbutton>\n            <span style=\"font:400 12.5px/1.5 Manrope,sans-serif;color:#7D8DA6\">Protected by a hidden spam check. No data leaves the page in demo mode.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer id=\"footer\" data-screen-label=\"Footer\" style=\"border-top:1px solid rgba(255,255,255,.09);background:rgba(4,9,18,.92);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)\">\n  <div style=\"max-width:1280px;margin:0 auto;padding:clamp(44px,6vw,72px) clamp(18px,4vw,40px) 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:clamp(24px,4vw,48px)\">\n    <div>\n      <img src=\"9e59f6b8-7d4c-4502-a5e9-ac66f4a718ca\" alt=\"KTW Crest\" style=\"height:30px;width:auto;display:block;margin-bottom:16px\">\n      <p style=\"margin:0 0 18px;max-width:34ch;font:400 13.5px/1.65 Manrope,sans-serif;color:#93A3BD\">Technology consulting from strategy through delivery. Registered in 2016.<\u002Fp>\n      <div style=\"display:flex;gap:10px\">\n        <span style=\"padding:9px 13px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11.5px/1 ui-monospace,Menlo,monospace;color:#8391A8\">LinkedIn — TBC<\u002Fspan>\n        <span style=\"padding:9px 13px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);font:500 11.5px/1 ui-monospace,Menlo,monospace;color:#8391A8\">X — TBC<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ footerCols }}\" as=\"col\" hint-placeholder-count=\"3\">\n      <div>\n        <p style=\"margin:0 0 14px;font:500 11px/1 Manrope,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#C8A45D\">{{ col.title }}<\u002Fp>\n        <ul style=\"margin:0;padding:0;list-style:none;display:grid;gap:9px\">\n          <sc-for list=\"{{ col.items }}\" as=\"it\" hint-placeholder-count=\"6\">\n            <li><a href=\"#top\" style=\"font:400 13.5px/1.5 Manrope,sans-serif;color:#B6C4D9\">{{ it }}<\u002Fa><\u002Fli>\n          <\u002Fsc-for>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"max-width:1280px;margin:0 auto;padding:20px clamp(18px,4vw,40px) 36px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center\">\n    <p style=\"margin:0;font:400 12.5px/1.5 Manrope,sans-serif;color:#7D8DA6\">© 2026 KTW Crest. All rights reserved. Company registration details to be confirmed.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:18px\">\n      <a href=\"#footer\" style=\"font:400 12.5px/1.5 Manrope,sans-serif;color:#93A3BD\">Privacy Notice<\u002Fa>\n      <a href=\"#footer\" style=\"font:400 12.5px/1.5 Manrope,sans-serif;color:#93A3BD\">Terms<\u002Fa>\n      <a href=\"#footer\" style=\"font:400 12.5px/1.5 Manrope,sans-serif;color:#93A3BD\">Cookie Notice<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<div style=\"position:fixed;left:16px;bottom:16px;z-index:70;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:rgba(7,14,26,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 40px rgba(0,0,0,.5)\">\n  <span style=\"font:500 10px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#8391A8;padding-left:4px\">3D depth<\u002Fspan>\n  <sc-for list=\"{{ bgModes }}\" as=\"m\" hint-placeholder-count=\"3\">\n    <button type=\"button\" sc-camel-on-click=\"{{ setBg }}\" data-mode=\"{{ m.id }}\" aria-pressed=\"{{ m.on }}\" style=\"padding:8px 12px;border-radius:9px;cursor:pointer;font:600 11.5px/1 Manrope,sans-serif;background:{{ m.bg }};border:1px solid {{ m.border }};color:{{ m.color }}\">{{ m.label }}<\u002Fbutton>\n  <\u002Fsc-for>\n<\u002Fdiv>\n\n<sc-if value=\"{{ chatClosed }}\" hint-placeholder-val=\"{{ true }}\">\n  <button type=\"button\" sc-camel-on-click=\"{{ openChat }}\" aria-label=\"Open KTW Guide, AI assistant\" style=\"position:fixed;right:20px;bottom:20px;z-index:70;display:inline-flex;align-items:center;gap:10px;padding:15px 20px;border-radius:999px;background:linear-gradient(135deg, #315CF5, #1E3AAE);color:#FFFFFF;font:600 14px/1 Manrope,sans-serif;border:1px solid rgba(255,255,255,.22);box-shadow:0 20px 50px rgba(49,92,245,.45);cursor:pointer;min-height:52px\" style-hover=\"transform:translateY(-2px)\">\n    <span aria-hidden=\"true\" style=\"width:8px;height:8px;border-radius:999px;background:#C8A45D;box-shadow:0 0 10px rgba(200,164,93,.9)\"><\u002Fspan>\n    Ask KTW Guide\n  <\u002Fbutton>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ chatOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div role=\"dialog\" aria-label=\"KTW Guide AI assistant\" style=\"position:fixed;right:0;bottom:0;z-index:80;width:min(430px,100vw);height:min(700px,100vh);max-height:100vh;padding:0 clamp(0px,2vw,20px) clamp(0px,2vw,20px) 0;display:flex\">\n    <div style=\"flex:1 1 auto;display:flex;flex-direction:column;border-radius:clamp(0px,3vw,22px);overflow:hidden;background:radial-gradient(120% 90% at 0% 0%, rgba(36,52,84,.86), rgba(7,13,25,.95));backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);border:1px solid rgba(255,255,255,.14);box-shadow:0 40px 90px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.16)\">\n      <div style=\"display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.1)\">\n        <span style=\"width:34px;height:34px;border-radius:10px;background:rgba(49,92,245,.28);border:1px solid rgba(120,167,255,.4);display:flex;align-items:center;justify-content:center;font:600 13px/1 Spectral,Georgia,serif;color:#CFE0FF\">KG<\u002Fspan>\n        <div style=\"flex:1 1 auto;min-width:0\">\n          <p style=\"margin:0;font:600 14px/1.2 Manrope,sans-serif;color:#FFFFFF\">KTW Guide<\u002Fp>\n          <p style=\"margin:0;font:500 10.5px/1.4 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#8FA0B8\">AI assistant · demo mode<\u002Fp>\n        <\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ clearChat }}\" style=\"padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#B6C4D9;font:500 11.5px/1 Manrope,sans-serif;cursor:pointer;min-height:36px\" style-hover=\"background:rgba(255,120,120,.16)\">Delete chat<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ closeChat }}\" aria-label=\"Close assistant\" style=\"width:36px;height:36px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#EAF0FA;font:500 15px/1 Manrope,sans-serif;cursor:pointer\">✕<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div ref=\"{{ setLogRef }}\" style=\"flex:1 1 auto;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px\">\n        <p style=\"margin:0 0 4px;padding:10px 12px;border-radius:10px;background:rgba(200,164,93,.09);border:1px solid rgba(200,164,93,.28);font:400 11.5px/1.5 Manrope,sans-serif;color:#E2CB9A\">You are chatting with an AI assistant, not a person. It answers only from approved KTW Crest content and never quotes prices, timelines or client names.<\u002Fp>\n        <sc-for list=\"{{ messages }}\" as=\"msg\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;justify-content:{{ msg.align }}\">\n            <div style=\"max-width:88%;padding:13px 15px;border-radius:{{ msg.radius }};background:{{ msg.bg }};border:1px solid {{ msg.border }}\">\n              <p style=\"margin:0;font:400 13.5px/1.6 Manrope,sans-serif;color:#E6EDF8;white-space:pre-line\">{{ msg.text }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ summary }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:16px;border-radius:14px;background:rgba(49,92,245,.14);border:1px solid rgba(120,167,255,.34)\">\n            <p style=\"margin:0 0 12px;font:500 10.5px/1 Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#9CC0FF\">Draft project summary — for your approval<\u002Fp>\n            <div style=\"display:grid;gap:9px\">\n              <sc-for list=\"{{ summaryRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n                <div style=\"display:grid;grid-template-columns:110px 1fr;gap:10px\">\n                  <span style=\"font:500 11.5px/1.5 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8FA0B8\">{{ row.k }}<\u002Fspan>\n                  <span style=\"font:400 13px/1.5 Manrope,sans-serif;color:#E6EDF8\">{{ row.v }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ summaryPending }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px;display:grid;gap:10px\">\n                <label style=\"display:flex;gap:10px;align-items:flex-start\">\n                  <input type=\"checkbox\" checked=\"{{ chatConsent }}\" sc-camel-on-change=\"{{ toggleChatConsent }}\" style=\"margin-top:3px;width:17px;height:17px;accent-color:#315CF5\">\n                  <span style=\"font:400 12px/1.5 Manrope,sans-serif;color:#C7D4E8\">I consent to KTW Crest storing this summary and my contact details so a consultant can respond.<\u002Fspan>\n                <\u002Flabel>\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ approveSummary }}\" style=\"padding:11px 16px;border-radius:10px;background:#315CF5;border:1px solid rgba(255,255,255,.2);color:#FFFFFF;font:600 12.5px/1 Manrope,sans-serif;cursor:pointer;min-height:44px\">Approve &amp; send<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ restartBrief }}\" style=\"padding:11px 16px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#EAF0FA;font:600 12.5px/1 Manrope,sans-serif;cursor:pointer;min-height:44px\">Start again<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ typing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:5px;padding:12px 15px;border-radius:14px 14px 14px 4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);align-self:flex-start\">\n            <span style=\"width:6px;height:6px;border-radius:999px;background:#9CC0FF;animation:ktw-dot 1.2s infinite\"><\u002Fspan>\n            <span style=\"width:6px;height:6px;border-radius:999px;background:#9CC0FF;animation:ktw-dot 1.2s .15s infinite\"><\u002Fspan>\n            <span style=\"width:6px;height:6px;border-radius:999px;background:#9CC0FF;animation:ktw-dot 1.2s .3s infinite\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"padding:12px 14px 14px;border-top:1px solid rgba(255,255,255,.1)\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px\">\n          <sc-for list=\"{{ quickReplies }}\" as=\"q\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ onQuick }}\" data-q=\"{{ q.id }}\" style=\"padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#DCE5F3;font:500 12px/1.2 Manrope,sans-serif;cursor:pointer;min-height:40px\" style-hover=\"background:rgba(120,167,255,.18);border-color:rgba(120,167,255,.4)\">{{ q.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <form sc-camel-on-submit=\"{{ sendChat }}\" style=\"display:flex;gap:9px;align-items:flex-end\">\n          <label style=\"flex:1 1 auto;display:grid;gap:0\">\n            <span style=\"position:absolute;left:-9999px\">Message KTW Guide<\u002Fspan>\n            <input type=\"text\" value=\"{{ draft }}\" sc-camel-on-input=\"{{ onDraft }}\" placeholder=\"Type your question…\" style=\"width:100%;box-sizing:border-box;padding:13px 14px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#F3F6FB;font:400 14px/1.3 Manrope,sans-serif;min-height:46px\">\n          <\u002Flabel>\n          <button type=\"submit\" style=\"padding:13px 18px;border-radius:11px;background:#315CF5;border:1px solid rgba(255,255,255,.2);color:#FFFFFF;font:600 13.5px/1 Manrope,sans-serif;cursor:pointer;min-height:46px\">Send<\u002Fbutton>\n        <\u002Fform>\n        <p style=\"margin:9px 0 0;font:400 11px/1.5 Manrope,sans-serif;color:#7D8DA6\">Only the minimum lead data is kept. <a href=\"#footer\">Privacy notice<\u002Fa> · retention period to be confirmed.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;bgMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;planes&quot;,&quot;corridor&quot;,&quot;field&quot;],&quot;default&quot;:&quot;corridor&quot;,&quot;tsType&quot;:&quot;'planes' | 'corridor' | 'field'&quot;,&quot;section&quot;:&quot;3D background&quot;},&quot;parallaxStrength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:120,&quot;step&quot;:5,&quot;default&quot;:60,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;3D background&quot;},&quot;chatOpenByDefault&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;KTW Guide&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    bg: null,\n    chat: 'closed',\n    messages: [],\n    typing: false,\n    draft: '',\n    flow: null,\n    answers: {},\n    summary: null,\n    summaryPending: true,\n    chatConsent: false,\n    form: { name: '', org: '', email: '', phone: '', service: 'CRM Solutions', stage: 'Exploring options', message: '', pref: 'email', consent: false },\n    honeypot: '',\n    formError: '',\n    formState: 'idle'\n  };\n\n  services = [\n    { no: '01', title: 'CRM Solutions', body: 'Strategy, implementation, configuration and optimisation so customer data finally lives in one dependable place.', tags: ['Strategy', 'Implementation', 'Migration'] },\n    { no: '02', title: 'Dashboards & Business Intelligence', body: 'Reporting and decision-support tools executives actually open, built on definitions your teams agree on.', tags: ['Data modelling', 'Reporting', 'Governance'] },\n    { no: '03', title: 'eCommerce Solutions', body: 'Storefronts, payments and operations joined up, so selling online stops creating manual work.', tags: ['Storefront', 'Payments', 'Operations'] },\n    { no: '04', title: 'Custom Applications', body: 'Web, mobile, portal and line-of-business systems for the workflows off-the-shelf software will not fit.', tags: ['Web', 'Mobile', 'Portals'] },\n    { no: '05', title: 'Integration & Automation', body: 'APIs, middleware and process digitisation that remove re-typing between systems.', tags: ['APIs', 'Middleware', 'Workflow'] },\n    { no: '06', title: 'Digital Strategy & Advisory', body: 'Product discovery, solution architecture and roadmaps you can fund and defend.', tags: ['Discovery', 'Architecture', 'Roadmap'] },\n    { no: '07', title: 'Product Design & Experience', body: 'Research, information architecture and UX/UI design that make complex tools feel obvious.', tags: ['Research', 'UX/UI', 'Design systems'] },\n    { no: '08', title: 'Programme & Project Delivery', body: 'Delivery management, quality assurance, launch and continuous improvement with clear governance.', tags: ['PMO', 'QA', 'Launch'] }\n  ];\n\n  problems = [\n    { problem: 'Customer information is scattered across spreadsheets, inboxes and two systems that disagree.', response: 'We map the real process first, then design a CRM and integration approach with one owner per data field.' },\n    { problem: 'Reports take days to assemble and still get challenged in the meeting.', response: 'We agree metric definitions with the people who use them, then build reporting on a model that can be audited.' },\n    { problem: 'The online store works, but fulfilment and finance are held together by manual steps.', response: 'We digitise the operational path from order to reconciliation and automate the handovers that break.' },\n    { problem: 'A previous build was delivered, but nobody can safely change it.', response: 'We assess the system, document what exists, and propose a staged path to something maintainable.' }\n  ];\n\n  steps = [\n    { no: '01', title: 'Discover', body: 'Stakeholder interviews, current-state review and a written problem statement.' },\n    { no: '02', title: 'Define', body: 'Scope, success measures, architecture options and a delivery plan you approve.' },\n    { no: '03', title: 'Design', body: 'Process, data and interface design, validated with the people who will use it.' },\n    { no: '04', title: 'Deliver', body: 'Build in increments with QA, documentation and a rehearsed launch.' },\n    { no: '05', title: 'Improve', body: 'Post-launch support, adoption review and a backlog for the next increment.' }\n  ];\n\n  solutions = [\n    { slot: 'Image — CRM workspace screenshot', title: 'CRM platforms', body: 'Pipelines, service queues and customer records configured around how your team already sells and supports.' },\n    { slot: 'Image — analytics dashboard screenshot', title: 'Analytics & dashboards', body: 'Executive and operational views with drill-down, refreshed on a schedule you can rely on.' },\n    { slot: 'Image — storefront / checkout screenshot', title: 'Commerce platforms', body: 'Catalogue, checkout and post-purchase flows integrated with stock, payments and finance.' },\n    { slot: 'Image — custom application screenshot', title: 'Custom platforms', body: 'Internal portals and line-of-business apps that replace spreadsheets and email approvals.' }\n  ];\n\n  disciplines = [\n    { no: 'I', title: 'Strategy', body: 'Business case, prioritisation and technology decisions framed for executives.' },\n    { no: 'II', title: 'Engineering', body: 'Platform configuration, custom development, integration and release practice.' },\n    { no: 'III', title: 'Data', body: 'Modelling, quality, reporting and decision-support design.' },\n    { no: 'IV', title: 'Design', body: 'Research, service and interface design for adoption, not decoration.' },\n    { no: 'V', title: 'Delivery', body: 'Programme and project management, QA and governance from kickoff to handover.' }\n  ];\n\n  cases = [\n    { slot: 'Image — case study visual', kind: 'CRM & integration', title: 'Case study slot one', body: 'Reserved for a verified engagement summary: context, approach, what was delivered. No results published until approved by the client.' },\n    { slot: 'Image — case study visual', kind: 'Dashboards & BI', title: 'Case study slot two', body: 'Reserved for a verified engagement summary. Client name, metrics and testimonials to be supplied by KTW Crest.' },\n    { slot: 'Image — case study visual', kind: 'Custom application', title: 'Case study slot three', body: 'Reserved for a verified engagement summary. Filterable case-study library follows on the Work page.' }\n  ];\n\n  contexts = ['Financial services', 'Retail & commerce', 'Professional services', 'Logistics & distribution', 'Manufacturing', 'Public sector & NGOs', 'Healthcare administration', 'Education', 'Energy & utilities'];\n\n  guidePoints = [\n    'Discloses that it is an AI assistant in every session.',\n    'Answers only from an approved knowledge base — no invented clients, prices or timelines.',\n    'Asks about goals, users, current systems, integrations and timing.',\n    'Sends a summary only after you approve it and give consent.'\n  ];\n\n  footerCols = [\n    { title: 'Services', items: ['CRM Solutions', 'Dashboards & BI', 'eCommerce Solutions', 'Custom Applications', 'Integration & Automation', 'Digital Strategy & Advisory'] },\n    { title: 'Company', items: ['About KTW Crest', 'Work / Case Studies', 'Insights', 'Programme & Project Delivery', 'Product Design & Experience', 'Contact'] },\n    { title: 'Contact', items: ['[ email to confirm ]', '[ phone to confirm ]', '[ city / country to confirm ]', 'Start a Project'] }\n  ];\n\n  kb = [\n    { tags: ['crm', 'customer', 'salesforce', 'hubspot', 'dynamics', 'pipeline'], a: 'CRM work covers strategy, implementation, configuration, integration and optimisation. We start by mapping your sales and service process, then design the data model and integrations before configuring anything.' },\n    { tags: ['dashboard', 'report', 'bi', 'analytics', 'data', 'kpi', 'power bi'], a: 'For dashboards and business intelligence we agree metric definitions with the people who use them, build an auditable data model, then deliver executive and operational views with drill-down.' },\n    { tags: ['ecommerce', 'shop', 'store', 'checkout', 'payment', 'commerce'], a: 'eCommerce engagements cover storefront, payments, operations and integration with stock and finance, so online selling does not create manual back-office work.' },\n    { tags: ['app', 'application', 'mobile', 'portal', 'custom', 'workflow', 'software'], a: 'Custom applications include web platforms, mobile apps, customer and partner portals, and line-of-business systems for workflows that packaged software cannot fit.' },\n    { tags: ['integration', 'api', 'automation', 'automate', 'connect', 'middleware'], a: 'Integration and automation work covers APIs, middleware, process digitisation and removing duplicate data entry between systems.' },\n    { tags: ['strategy', 'advisory', 'roadmap', 'architecture', 'discovery'], a: 'Digital strategy and advisory covers product discovery, solution architecture, technology roadmaps and business cases you can fund and defend.' },\n    { tags: ['design', 'ux', 'ui', 'research', 'usability'], a: 'Product design and experience covers user research, information architecture, UX/UI design and design systems, focused on adoption.' },\n    { tags: ['delivery', 'project', 'programme', 'pmo', 'qa', 'quality', 'governance'], a: 'Programme and project delivery covers delivery management, quality assurance, launch execution and continuous improvement with clear governance.' },\n    { tags: ['about', 'who', 'company', 'team', 'registered', 'history', 'experience'], a: 'KTW Crest is a technology consulting company registered in 2016. The team is multidisciplinary — strategy, engineering, data, design and delivery management — with senior consulting experience across large transformation programmes.' },\n    { tags: ['process', 'how do you work', 'approach', 'method', 'steps'], a: 'We work in five steps: Discover, Define, Design, Deliver, Improve. Each step has named outputs you approve before the next begins.' },\n    { tags: ['price', 'cost', 'quote', 'budget', 'rate', 'fee', 'how much', 'timeline', 'how long', 'deadline'], a: 'I cannot quote prices or delivery dates. A consultant confirms scope, price and delivery dates with you after a short discovery conversation. I can capture your requirements so that conversation starts well.' },\n    { tags: ['data', 'privacy', 'popia', 'gdpr', 'store'], a: 'Only the minimum lead and conversation data is kept, and only with your consent. You can delete this conversation at any time using Delete chat. Final privacy wording is being reviewed by professionals.' }\n  ];\n\n  briefQuestions = [\n    { k: 'goal', q: 'What business outcome are you aiming for?' },\n    { k: 'users', q: 'Who will use the solution day to day?' },\n    { k: 'systems', q: 'Which systems are in place today?' },\n    { k: 'integrations', q: 'What needs to connect or integrate?' },\n    { k: 'timing', q: 'When would you like to start?' },\n    { k: 'contact', q: 'How should a consultant reach you? Please share a name and work email or phone number.' }\n  ];\n\n  baseQuick = [\n    { id: 'service', label: 'Find the right service' },\n    { id: 'brief', label: 'Shape my project brief' },\n    { id: 'consult', label: 'Request a consultation' },\n    { id: 'about', label: 'Ask about KTW Crest' }\n  ];\n\n  greeting = 'Welcome to KTW Crest. I can help you explore our services, shape a project brief, or request a consultation. What would you like to achieve?';\n\n  componentDidMount() {\n    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    this.strength = Number(this.props.parallaxStrength ?? 60) / 60;\n    this.onScroll = () => {\n      if (this.raf) return;\n      this.raf = requestAnimationFrame(() => {\n        this.raf = null;\n        const y = window.scrollY || document.documentElement.scrollTop || 0;\n        if (this.bgEl) this.bgEl.style.setProperty('--sy', String(this.reduced ? 0 : y * this.strength));\n      });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    document.addEventListener('scroll', this.onScroll, { capture: true, passive: true });\n    this.onScroll();\n\n    if (!this.reduced && 'IntersectionObserver' in window) {\n      const els = Array.prototype.slice.call(document.querySelectorAll('[data-reveal]'));\n      els.forEach((el) => {\n        el.style.opacity = '0';\n        el.style.transform = 'translateY(22px)';\n        el.style.transition = 'opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1)';\n      });\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach((e) => {\n          if (e.isIntersecting) {\n            e.target.style.opacity = '1';\n            e.target.style.transform = 'none';\n            io.unobserve(e.target);\n          }\n        });\n      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });\n      els.forEach((el) => io.observe(el));\n      this.io = io;\n    }\n    if (this.props.chatOpenByDefault) this.openChat();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    document.removeEventListener('scroll', this.onScroll, true);\n    if (this.io) this.io.disconnect();\n    if (this.raf) cancelAnimationFrame(this.raf);\n  }\n\n  componentDidUpdate() {\n    if (this.logEl) this.logEl.scrollTop = this.logEl.scrollHeight;\n  }\n\n  mode() { return this.state.bg || this.props.bgMode || 'corridor'; }\n\n  push(role, text) {\n    this.setState((s) => ({ messages: s.messages.concat([{ id: s.messages.length + '-' + role, role, text }]) }));\n  }\n\n  bot(text, quick, delay) {\n    this.setState({ typing: true });\n    clearTimeout(this.botTimer);\n    this.botTimer = setTimeout(() => {\n      this.setState({ typing: false });\n      this.push('bot', text);\n      if (quick) this.setState({ quick });\n    }, delay || 620);\n  }\n\n  openChat = () => {\n    const first = this.state.messages.length === 0;\n    this.setState({ chat: 'open' });\n    if (first) this.bot(this.greeting, this.baseQuick, 320);\n  };\n\n  closeChat = () => this.setState({ chat: 'closed' });\n\n  clearChat = () => {\n    clearTimeout(this.botTimer);\n    this.setState({ messages: [], flow: null, answers: {}, summary: null, summaryPending: true, chatConsent: false, typing: false, quick: null, draft: '' });\n    this.bot('Conversation deleted. Nothing from it is retained.\\n\\n' + this.greeting, this.baseQuick, 300);\n  };\n\n  setBg = (e) => {\n    const m = e.currentTarget.getAttribute('data-mode');\n    this.setState({ bg: m });\n  };\n\n  setBgRef = (el) => { this.bgEl = el; if (el && this.onScroll) this.onScroll(); };\n  setLogRef = (el) => { this.logEl = el; };\n  onDraft = (e) => this.setState({ draft: e.target.value });\n\n  answer(text) {\n    const t = String(text || '').toLowerCase();\n    if (/\\b(idiot|stupid|useless|shut up|damn you)\\b/.test(t)) {\n      return 'I would rather keep this useful for you. Ask me anything about our services, or I can pass you to a person.';\n    }\n    let best = null, score = 0;\n    this.kb.forEach((entry) => {\n      let s = 0;\n      entry.tags.forEach((tag) => { if (t.indexOf(tag) >= 0) s += tag.length; });\n      if (s > score) { score = s; best = entry; }\n    });\n    if (best) return best.a;\n    return null;\n  }\n\n  sendChat = (e) => {\n    e.preventDefault();\n    const text = this.state.draft.trim();\n    if (!text) {\n      this.bot('There was nothing in the message. Type a question, or pick one of the options below.', this.baseQuick, 260);\n      return;\n    }\n    this.push('user', text);\n    this.setState({ draft: '' });\n    const flow = this.state.flow;\n    if (flow && flow.type === 'brief') { this.advanceBrief(text); return; }\n    const a = this.answer(text);\n    if (a) {\n      this.bot(a, [{ id: 'brief', label: 'Shape my project brief' }, { id: 'consult', label: 'Request a consultation' }, { id: 'human', label: 'Speak to a person' }]);\n    } else {\n      this.bot('That sits outside the approved content I can speak to, so I will not guess. A consultant can answer it properly — shall I take your details, or would you like to pick a topic below?', [{ id: 'human', label: 'Speak to a person' }, { id: 'service', label: 'Find the right service' }, { id: 'about', label: 'Ask about KTW Crest' }]);\n    }\n  };\n\n  onQuick = (e) => {\n    const id = e.currentTarget.getAttribute('data-q');\n    const found = this.quickList().filter((q) => q.id === id)[0];\n    if (found) this.push('user', found.label);\n    if (id === 'brief') { this.startBrief(); return; }\n    if (id === 'service') {\n      this.bot('Tell me which is closest to your goal and I will point you to the right practice.', [\n        { id: 'g-crm', label: 'One view of the customer' },\n        { id: 'g-bi', label: 'See the numbers clearly' },\n        { id: 'g-ecom', label: 'Sell more online' },\n        { id: 'g-auto', label: 'Remove manual work' },\n        { id: 'g-app', label: 'Build something custom' }\n      ]);\n      return;\n    }\n    if (id === 'consult') {\n      this.setState({ flow: { type: 'brief', step: 5 }, answers: Object.assign({}, this.state.answers) });\n      this.bot('Happy to arrange that. ' + this.briefQuestions[5].q, null);\n      return;\n    }\n    if (id === 'about') { this.bot(this.kb[8].a, this.baseQuick); return; }\n    if (id === 'human') {\n      this.setState({ flow: { type: 'brief', step: 5 } });\n      this.bot('Of course. Share a name and a work email or phone number, and a consultant will follow up. A person always confirms scope, price and delivery dates.', null);\n      return;\n    }\n    const map = { 'g-crm': 0, 'g-bi': 1, 'g-ecom': 2, 'g-auto': 4, 'g-app': 3 };\n    if (map[id] !== undefined) {\n      const svc = this.services[map[id]];\n      this.bot(svc.title + ' is the closest fit.\\n\\n' + svc.body + '\\n\\nWould you like me to draft a short project brief for a consultant to review?', [{ id: 'brief', label: 'Yes, shape my brief' }, { id: 'about', label: 'Tell me about KTW Crest' }]);\n      return;\n    }\n    this.bot('Let me know what you would like to do next.', this.baseQuick);\n  };\n\n  startBrief() {\n    this.setState({ flow: { type: 'brief', step: 0 }, answers: {}, summary: null, summaryPending: true, chatConsent: false });\n    this.bot('I will ask six short questions, then draft a summary for you to approve. Nothing is sent until you do.\\n\\n' + this.briefQuestions[0].q, null);\n  }\n\n  restartBrief = () => { this.setState({ summary: null }); this.startBrief(); };\n\n  advanceBrief(text) {\n    const flow = this.state.flow;\n    const q = this.briefQuestions[flow.step];\n    const answers = Object.assign({}, this.state.answers);\n    answers[q.k] = text;\n    const next = flow.step + 1;\n    if (next < this.briefQuestions.length) {\n      this.setState({ answers, flow: { type: 'brief', step: next } });\n      this.bot(this.briefQuestions[next].q, null);\n    } else {\n      this.setState({ answers, flow: null, summary: answers, summaryPending: true });\n      this.bot('Here is the draft summary. Check it, tick consent, then approve and I will pass it to KTW Crest. A consultant will confirm scope, price and delivery dates with you.', null);\n    }\n  }\n\n  toggleChatConsent = () => this.setState((s) => ({ chatConsent: !s.chatConsent }));\n\n  approveSummary = () => {\n    if (!this.state.chatConsent) {\n      this.bot('I need your consent before sending anything. Tick the consent box and approve again.', null, 220);\n      return;\n    }\n    this.setState({ summaryPending: false });\n    this.bot('Summary approved and queued for KTW Crest.\\n\\nDemo mode: this build has no live endpoint, so nothing was transmitted. Connect a secure server-side endpoint and this posts a lead record with your consent flag. A consultant would then confirm scope, price and delivery dates.', [{ id: 'about', label: 'Ask about KTW Crest' }, { id: 'service', label: 'Find another service' }], 900);\n  };\n\n  quickList() {\n    const extra = this.state.quick || this.baseQuick;\n    return this.state.flow ? [] : extra.concat([]);\n  }\n\n  onField = (e) => {\n    const f = e.currentTarget.getAttribute('data-field');\n    const v = e.target.value;\n    this.setState((s) => ({ form: Object.assign({}, s.form, { [f]: v }), formError: '' }));\n  };\n\n  onConsent = () => this.setState((s) => ({ form: Object.assign({}, s.form, { consent: !s.form.consent }), formError: '' }));\n  onHoneypot = (e) => { this.honey = e.target.value; };\n  setPref = (e) => {\n    const p = e.currentTarget.getAttribute('data-pref');\n    this.setState((s) => ({ form: Object.assign({}, s.form, { pref: p }) }));\n  };\n\n  submitForm = (e) => {\n    e.preventDefault();\n    const f = this.state.form;\n    if (this.honey) { this.setState({ formError: 'This submission was blocked by our spam check.' }); return; }\n    if (!f.name.trim()) { this.setState({ formError: 'Please add your name so we know who we are replying to.' }); return; }\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]{2,}$/.test(f.email.trim())) { this.setState({ formError: 'Please enter a valid work email address.' }); return; }\n    if (f.message.trim().length < 12) { this.setState({ formError: 'Please tell us a little more about what you are trying to achieve.' }); return; }\n    if (!f.consent) { this.setState({ formError: 'Please give consent so we may store your details to reply.' }); return; }\n    this.setState({ formState: 'sending', formError: '' });\n    clearTimeout(this.formTimer);\n    this.formTimer = setTimeout(() => this.setState({ formState: 'sent' }), 1100);\n  };\n\n  resetForm = () => this.setState({ formState: 'idle', form: { name: '', org: '', email: '', phone: '', service: 'CRM Solutions', stage: 'Exploring options', message: '', pref: 'email', consent: false } });\n\n  renderVals() {\n    const m = this.mode();\n    const chip = (on) => ({\n      bg: on ? 'rgba(49,92,245,.4)' : 'rgba(255,255,255,.05)',\n      border: on ? '1px solid rgba(120,167,255,.5)' : '1px solid rgba(255,255,255,.12)',\n      color: on ? '#FFFFFF' : '#B6C4D9'\n    });\n    const bgModes = [\n      { id: 'planes', label: 'Planes' },\n      { id: 'corridor', label: 'Corridor' },\n      { id: 'field', label: 'Field' }\n    ].map((x) => {\n      const c = chip(m === x.id);\n      return { id: x.id, label: x.label, on: m === x.id ? 'true' : 'false', bg: c.bg, border: c.border, color: c.color };\n    });\n\n    const messages = this.state.messages.map((msg) => ({\n      id: msg.id,\n      text: msg.text,\n      align: msg.role === 'user' ? 'flex-end' : 'flex-start',\n      radius: msg.role === 'user' ? '14px 14px 4px 14px' : '14px 14px 14px 4px',\n      bg: msg.role === 'user' ? 'rgba(49,92,245,.32)' : 'rgba(255,255,255,.06)',\n      border: msg.role === 'user' ? '1px solid rgba(120,167,255,.35)' : '1px solid rgba(255,255,255,.10)'\n    }));\n\n    const s = this.state.summary;\n    const labels = { goal: 'Outcome', users: 'Users', systems: 'Systems', integrations: 'Integrations', timing: 'Timing', contact: 'Contact' };\n    const summaryRows = s ? Object.keys(labels).filter((k) => s[k]).map((k) => ({ k: labels[k], v: s[k] })) : [];\n\n    const prefs = [{ id: 'email', label: 'Email me' }, { id: 'call', label: 'Call me' }, { id: 'either', label: 'Either is fine' }];\n    const contactPrefs = prefs.map((p) => {\n      const on = this.state.form.pref === p.id;\n      const c = chip(on);\n      return { id: p.id, label: p.label, bg: c.bg, border: c.border, color: c.color };\n    });\n\n    const fs = this.state.formState;\n    return {\n      isPlanes: m === 'planes',\n      isCorridor: m === 'corridor',\n      isField: m === 'field',\n      bgModes,\n      setBg: this.setBg,\n      setBgRef: this.setBgRef,\n      setLogRef: this.setLogRef,\n      services: this.services,\n      serviceNames: this.services.map((x) => x.title),\n      problems: this.problems,\n      steps: this.steps,\n      solutions: this.solutions,\n      disciplines: this.disciplines,\n      cases: this.cases,\n      contexts: this.contexts,\n      guidePoints: this.guidePoints,\n      footerCols: this.footerCols,\n      stages: ['Exploring options', 'Business case / budgeting', 'Ready to start', 'Rescuing an existing build'],\n      contactPrefs,\n      setPref: this.setPref,\n      form: this.state.form,\n      onField: this.onField,\n      onConsent: this.onConsent,\n      onHoneypot: this.onHoneypot,\n      submitForm: this.submitForm,\n      resetForm: this.resetForm,\n      formError: this.state.formError,\n      formSent: fs === 'sent',\n      formOpen: fs !== 'sent',\n      submitLabel: fs === 'sending' ? 'Sending…' : 'Send enquiry',\n      chatOpen: this.state.chat === 'open',\n      chatClosed: this.state.chat !== 'open',\n      openChat: this.openChat,\n      closeChat: this.closeChat,\n      clearChat: this.clearChat,\n      messages,\n      typing: this.state.typing,\n      draft: this.state.draft,\n      onDraft: this.onDraft,\n      sendChat: this.sendChat,\n      onQuick: this.onQuick,\n      quickReplies: this.quickList(),\n      summary: s,\n      summaryRows,\n      summaryPending: this.state.summaryPending,\n      chatConsent: this.state.chatConsent,\n      toggleChatConsent: this.toggleChatConsent,\n      approveSummary: this.approveSummary,\n      restartBrief: this.restartBrief\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
